<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klien Pilih Foto - Studio App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Image selection & anti-theft */
        .photo-card { transition: all 0.2s ease-in-out; -webkit-user-select: none; user-select: none; }
        .photo-card:active { transform: scale(0.97); }
        .selected-overlay { opacity: 0; transition: opacity 0.2s ease; }
        .photo-card.selected .selected-overlay { opacity: 1; }
        .photo-card.selected img { transform: scale(0.95); border-radius: 0.5rem; }
        
        /* Prevent long-press saving on mobile */
        img { -webkit-touch-callout: none; pointer-events: none; }
    </style>
</head>
<body class="text-slate-800 pb-24" oncontextmenu="return false;"> <!-- Block Global Right Click -->

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-blue-200">
                    <i class="fa-solid fa-camera-retro"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight" id="headerTitle">Pilih Foto Studio</h1>
                    <p class="text-xs text-slate-500" id="headerSubtitle">Client Selection Tool</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-6">
        
        <!-- Input Section -->
        <div id="inputSection" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mb-8 max-w-2xl mx-auto">
            <div class="text-center mb-6">
                <h2 class="text-xl font-semibold mb-2">Pilih Foto yang Akan Diedit</h2>
                <p class="text-slate-500 text-sm">Masukkan link folder Google Drive yang telah diberikan oleh fotografer Anda.</p>
            </div>
            
            <div class="space-y-4">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-brands fa-google-drive text-slate-400 text-lg"></i>
                    </div>
                    <input type="text" id="driveLink" 
                        class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition outline-none" 
                        placeholder="https://drive.google.com/drive/folders/xxxx...">
                </div>
                <!-- Dropdown opsi watermark klien telah dihapus di sini agar klien tidak bisa mengubah settingan admin -->
            </div>
            
            <div class="mt-6 flex gap-3 justify-center">
                <button onclick="loadFromDrive()" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition shadow-md shadow-blue-200 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-down"></i> Tampilkan Foto
                </button>
                <button onclick="loadDemoMode()" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Coba Demo
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden flex-col items-center justify-center py-12">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-4"></i>
            <p class="text-slate-500">Mengambil foto dari Google Drive...</p>
        </div>

        <!-- Gallery Grid -->
        <div id="galleryContainer" class="hidden">
            <div class="flex justify-between items-end mb-4 px-1">
                <h3 class="font-semibold text-lg" id="galleryTitle">Daftar Foto</h3>
                <button onclick="selectAll()" class="text-sm text-blue-600 font-medium hover:underline px-2 py-1 rounded">Pilih Semua</button>
            </div>
            
            <div id="photoGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4 relative">
                <!-- Images will be injected here -->
            </div>
        </div>
        
    </main>

    <!-- Floating Bottom Action Bar -->
    <div id="actionBar" class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-200 shadow-[0_-4px_15px_-3px_rgba(0,0,0,0.05)] transform translate-y-full transition-transform duration-300 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-100 text-blue-700 font-bold w-10 h-10 rounded-full flex items-center justify-center" id="selectedCount">0</div>
                <div class="hidden md:block">
                    <p class="font-semibold text-sm leading-tight text-slate-800">Foto Terpilih</p>
                    <p class="text-xs text-slate-500">Siap dikirim ke fotografer</p>
                </div>
            </div>
            <button onclick="copyToClipboard()" class="px-5 md:px-8 py-3 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl transition flex items-center gap-2 shadow-lg hover:shadow-slate-500/30">
                <i class="fa-solid fa-copy"></i> <span class="hidden md:inline">Copy List WA</span><span class="md:hidden">Copy</span>
            </button>
        </div>
    </div>

    <!-- Custom Alert -->
    <div id="customAlert" class="fixed top-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl z-[60] flex items-center gap-3 transition-all duration-300 transform -translate-y-24 opacity-0 pointer-events-none">
        <i id="alertIcon" class="fa-solid fa-circle-check text-green-400"></i>
        <span id="alertText" class="text-sm font-medium">Notifikasi</span>
    </div>

    <script>
        const CONFIG = { BACKEND_API_URL: "api.php" };

        // Tambahkan properti watermarkType di appState dengan nilai default 'loop'
        let appState = { photos: [], selectedIds: new Set(), studioName: "PROOF ONLY", watermarkType: "loop" };

        // 1. Inisialisasi Nama Studio & Setingan Watermark Admin dari URL
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const studioParam = urlParams.get('studio');
            const wmParam = urlParams.get('wm');
            
            // Membaca setting watermark dari link yang di-generate admin
            if (wmParam === 'none' || wmParam === 'single' || wmParam === 'loop') {
                appState.watermarkType = wmParam;
            }

            if (studioParam) {
                appState.studioName = studioParam.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
                
                const headerTitle = document.getElementById('headerTitle');
                const headerSubtitle = document.getElementById('headerSubtitle');
                if(headerTitle) headerTitle.textContent = "Pilih Foto - " + appState.studioName;
                if(headerSubtitle) headerSubtitle.textContent = "Klien " + appState.studioName + ", silakan pilih foto di bawah.";
                document.title = "Pilih Foto | " + appState.studioName;
            }
        });

        function showAlert(message, type = 'success') {
            const alertBox = document.getElementById('customAlert');
            const alertText = document.getElementById('alertText');
            const alertIcon = document.getElementById('alertIcon');
            
            alertText.textContent = message;
            alertIcon.className = type === 'success' ? "fa-solid fa-circle-check text-green-400" : 
                                 (type === 'error' ? "fa-solid fa-triangle-exclamation text-red-400" : "fa-solid fa-circle-info text-blue-400");

            alertBox.classList.remove('-translate-y-24', 'opacity-0');
            setTimeout(() => alertBox.classList.add('-translate-y-24', 'opacity-0'), 3000);
        }

        function extractFolderId(url) {
            const match = url.match(/folders\/([a-zA-Z0-9-_]+)/);
            if (match && match[1]) return match[1];
            const matchId = url.match(/id=([a-zA-Z0-9-_]+)/);
            if (matchId && matchId[1]) return matchId[1];
            return null;
        }

        async function loadFromDrive() {
            const link = document.getElementById('driveLink').value.trim();
            if (!link) return showAlert('Harap masukkan link folder Google Drive.', 'error');
            const folderId = extractFolderId(link);
            if (!folderId) return showAlert('Link tidak valid. Pastikan link berisi ID Folder.', 'error');

            showLoading(true);
            try {
                const response = await fetch(`${CONFIG.BACKEND_API_URL}?folderId=${folderId}`);
                const data = await response.json();

                if (data.error) throw new Error(data.error.message);

                if (data.files && data.files.length > 0) {
                    appState.photos = data.files.map(file => ({
                        id: file.id, name: file.name, 
                        url: file.thumbnailLink ? file.thumbnailLink.replace('=s220', '=s800') : ''
                    }));
                    appState.selectedIds.clear();
                    renderGallery();
                    showAlert(`${appState.photos.length} foto berhasil dimuat!`, 'success');
                } else {
                    showAlert('Folder kosong atau tidak ada file gambar.', 'info');
                    showLoading(false);
                }
            } catch (error) {
                showAlert('Gagal mengambil data. Pastikan folder Public.', 'error');
                showLoading(false);
            }
        }

        function loadDemoMode() {
            showLoading(true);
            setTimeout(() => {
                const dummyData = [];
                for(let i = 1; i <= 12; i++) {
                    const width = 600; const height = 400 + Math.floor(Math.random() * 200); 
                    const bgColors = ['e2e8f0', 'cbd5e1', 'f1f5f9', 'e0f2fe', 'dbeafe'];
                    dummyData.push({
                        id: `img_demo_${i}`,
                        name: `DSC_${i.toString().padStart(4, '0')}.JPG`,
                        url: `https://placehold.co/${width}x${height}/${bgColors[i % bgColors.length]}/64748b?text=Demo+Foto+${i}`
                    });
                }
                appState.photos = dummyData;
                appState.selectedIds.clear();
                renderGallery();
                showAlert('Memuat data demo...', 'info');
            }, 800);
        }

        function showLoading(show) {
            document.getElementById('loadingState').classList.toggle('hidden', !show);
            document.getElementById('galleryContainer').classList.toggle('hidden', show);
            if(show) document.getElementById('photoGrid').innerHTML = ''; 
            updateActionBar();
        }

        // FUNGSI GENERATOR WATERMARK 
        function getWatermarkOverlay(type) {
            const wmDiv = document.createElement('div');
            wmDiv.className = "absolute inset-0 z-10 pointer-events-none flex items-center justify-center overflow-hidden";
            
            if (type === 'single') {
                wmDiv.innerHTML = `<span class="text-white/60 font-bold text-xl md:text-2xl tracking-widest drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] transform -rotate-45 select-none text-center px-4 w-full break-words leading-tight">${appState.studioName}</span>`;
            } else if (type === 'loop') {
                const safeName = appState.studioName.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><text transform='rotate(-35 80 80)' x='80' y='80' font-size='16' fill='rgba(255,255,255,0.45)' font-weight='bold' font-family='sans-serif' text-anchor='middle' style='text-shadow: 1px 1px 2px rgba(0,0,0,0.8);'>${safeName}</text></svg>`;
                wmDiv.style.backgroundImage = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
                wmDiv.style.backgroundRepeat = "repeat";
            }
            return wmDiv;
        }

        function renderGallery() {
            showLoading(false);
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = '';
            
            // Membaca tipe watermark langsung dari appState (yang ditangkap dari URL admin)
            const watermarkType = appState.watermarkType;

            appState.photos.forEach(photo => {
                const card = document.createElement('div');
                card.className = `photo-card relative cursor-pointer bg-slate-100 rounded-xl overflow-hidden aspect-square border-4 border-transparent hover:shadow-md ${appState.selectedIds.has(photo.id) ? 'selected !border-blue-500 shadow-lg' : ''}`;
                card.onclick = () => toggleSelect(photo.id, card);
                
                // Mencegah klik kanan di masing-masing card
                card.addEventListener('contextmenu', e => e.preventDefault());

                const img = document.createElement('img');
                img.src = photo.url;
                img.className = "w-full h-full object-cover transition-transform duration-300";
                img.loading = "lazy";
                
                // Layer Watermark
                if (watermarkType !== 'none') {
                    card.appendChild(getWatermarkOverlay(watermarkType));
                }

                // Overlay Centang (Checkmark)
                const overlay = document.createElement('div');
                overlay.className = "selected-overlay absolute inset-0 bg-blue-600/20 z-20 flex items-start justify-end p-3 pointer-events-none";
                overlay.innerHTML = '<div class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-md ring-2 ring-white"><i class="fa-solid fa-check"></i></div>';

                // Label Nama File
                const nameLabel = document.createElement('div');
                nameLabel.className = "absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent p-3 pt-8 z-20 pointer-events-none";
                nameLabel.innerHTML = `<p class="text-white text-xs md:text-sm font-medium truncate drop-shadow-md">${photo.name}</p>`;

                card.appendChild(img);
                card.appendChild(overlay);
                card.appendChild(nameLabel);
                grid.appendChild(card);
            });
        }

        function toggleSelect(id, cardElement) {
            if (appState.selectedIds.has(id)) {
                appState.selectedIds.delete(id);
                cardElement.classList.remove('selected', '!border-blue-500', 'shadow-lg');
            } else {
                appState.selectedIds.add(id);
                cardElement.classList.add('selected', '!border-blue-500', 'shadow-lg');
            }
            updateActionBar();
        }

        function selectAll() {
            if (appState.selectedIds.size === appState.photos.length) {
                appState.selectedIds.clear();
            } else {
                appState.photos.forEach(p => appState.selectedIds.add(p.id));
            }
            renderGallery();
            updateActionBar();
        }

        function updateActionBar() {
            const count = appState.selectedIds.size;
            const bar = document.getElementById('actionBar');
            document.getElementById('selectedCount').textContent = count;
            if (count > 0) bar.classList.remove('translate-y-full');
            else bar.classList.add('translate-y-full');
        }

        function copyToClipboard() {
            if (appState.selectedIds.size === 0) return;
            const selectedNames = appState.photos.filter(p => appState.selectedIds.has(p.id)).map(p => p.name);
            const textToCopy = `*List Foto Pilihan Client*\nNama Studio: ${appState.studioName}\nTotal: ${selectedNames.length} Foto\n\n${selectedNames.join('\n')}\n\n_Mohon segera diproses edit, terima kasih!_`;

            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            textArea.style.position = "fixed"; textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus(); textArea.select();
            
            try {
                if (document.execCommand('copy')) showAlert('List foto berhasil di-copy! Silakan paste di chat WhatsApp.', 'success');
                else showAlert('Gagal copy. Silakan coba lagi.', 'error');
            } catch (err) {
                showAlert('Browser Anda tidak mendukung copy otomatis.', 'error');
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
